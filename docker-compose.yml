# Local development only: a Postgres for the API. The API itself is built with cargo inside
# the whole repository (it compiles in src/lib/verse/pron-en.ts and confusables.ts) and run
# beside it; see CLAUDE.md, "Building the API". It has no container image.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inspired_mile
      POSTGRES_USER: inspired_mile
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspired_mile"]
      interval: 5s
      timeout: 3s
      retries: 5


volumes:
  pgdata:
