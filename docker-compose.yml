services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inspired_mile
      POSTGRES_USER: inspired_mile
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspired_mile"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://inspired_mile:devpassword@db:5432/inspired_mile
      # No default: sessions are signed with it and the API refuses to start without one of
      # at least 32 bytes. Export JWT_SECRET (openssl rand -base64 48) before `docker compose up`.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set (generate one with openssl rand -base64 48)}
      PORT: "3849"
      CORS_ORIGIN: http://localhost:4321
      # Passkeys: the relying-party ID and the page origins that may use it.
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_ORIGIN: http://localhost:4321
      # Email sign-in is off (503) until a Resend key is set here.
      RESEND_API_KEY: ""
      EMAIL_FROM: "Sonnet Man <signin@inspiredmile.com>"
      LLM_API_KEY: ""
    ports:
      - "3849:3849"

volumes:
  pgdata:
